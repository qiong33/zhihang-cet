<!DOCTYPE html>
<html lang="zh-CN" data-theme="day" data-page-node-id="9FFqmGa8vKSeeePNFz0En0">
<head data-page-node-id="iaNp24zz0cH4Fliu9telrb">
<meta charset="UTF-8" data-page-node-id="Ejhn2tcbTj60glk7KnCi9I">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="q4u7sNPVhL3CehIsuDE5El">
<title>糊糊婕备考四六级</title>
<style>
/* ============ 主题变量（温暖水彩书桌风） ============ */
[data-theme="day"]{
  --bg:#F7F1E7; --card:#FDFBF5; --text:#42352A; --text-2:#6E5B4A; --text-3:#9A846D;
  --primary:#A15E56; --primary-hover:#8E4F48; --on-primary:#FDFBF5;
  --accent:#A15E56; --border:#E7DAC6; --input-bg:#FDFBF5; --hover:#F2EADA;
  --banner1:#F3E7D3; --banner2:#FBF6EC; --shadow:0 1px 3px rgba(66,53,42,.07),0 4px 14px rgba(66,53,42,.06);
  --shadow-hover:0 4px 10px rgba(66,53,42,.10),0 10px 26px rgba(66,53,42,.10);
  --ok:#7E8B54; --warn:#B98543; --danger:#B45450;
}
[data-theme="night"]{
  --bg:#211A13; --card:#2C2318; --text:#F3E9DA; --text-2:#C7B49D; --text-3:#97826A;
  --primary:#D2937F; --primary-hover:#DDA693; --on-primary:#211A13;
  --accent:#D2937F; --border:#403325; --input-bg:#191309; --hover:#332818;
  --banner1:#2E2416; --banner2:#211A13; --shadow:0 1px 3px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.30);
  --shadow-hover:0 6px 14px rgba(0,0,0,.45),0 14px 32px rgba(0,0,0,.38);
  --ok:#A3B073; --warn:#D8A468; --danger:#D98076;
}
[data-theme="eye"]{
  --bg:#EEF0E2; --card:#FAFAF0; --text:#3A3E30; --text-2:#646A52; --text-3:#8D9179;
  --primary:#9D5F57; --primary-hover:#8B514B; --on-primary:#FAFAF0;
  --accent:#9D5F57; --border:#DCDFC9; --input-bg:#FAFAF0; --hover:#E6E8D4;
  --banner1:#E9ECD6; --banner2:#F5F6EA; --shadow:0 1px 3px rgba(58,62,48,.08),0 4px 14px rgba(58,62,48,.06);
  --shadow-hover:0 4px 10px rgba(58,62,48,.12),0 10px 26px rgba(58,62,48,.10);
  --ok:#647A3E; --warn:#A67B2E; --danger:#A85450;
}
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
:root{--font-serif:"Noto Serif SC","Source Han Serif SC","STZhongsong","STSong","SimSun",serif}
body{
  background:var(--bg);color:var(--text);
  font-family:"Inter","PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{line-height:1.3;font-weight:700;font-family:var(--font-serif);letter-spacing:.5px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text)}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
svg.icon{width:18px;height:18px;flex:none;vertical-align:-3px}
.muted{color:var(--text-3)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-2);background:transparent;white-space:nowrap}
.tag-blue{border-color:var(--accent);color:var(--accent)}
/* ============ 按钮 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 22px;border-radius:11px;font-size:15px;font-weight:600;border:1px solid transparent;transition:background .18s,border-color .18s,box-shadow .18s,transform .1s;white-space:nowrap}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover);box-shadow:var(--shadow-hover);text-decoration:none}
.btn-primary:active{transform:translateY(1px);box-shadow:var(--shadow)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);background:var(--hover);text-decoration:none}
.btn-outline:active{transform:translateY(1px)}
.btn-text{background:transparent;color:var(--accent);height:auto;padding:4px 8px;font-weight:600}
.btn-text:hover{text-decoration:underline}
.btn-sm{height:34px;padding:0 14px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn .spinner{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ============ 顶栏 ============ */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);transition:background .25s}
.topbar-inner{display:flex;align-items:center;height:62px;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-serif);font-size:19px;font-weight:800;color:var(--text);letter-spacing:1px}
.brand:hover{text-decoration:none}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary-hover));display:flex;align-items:center;justify-content:center;color:var(--on-primary)}
.brand-sub{font-size:11px;font-weight:600;letter-spacing:2.5px;color:var(--text-3);font-family:Georgia,"Times New Roman",serif;margin-left:2px;transform:translateY(1px)}
.mainnav{display:flex;gap:6px;flex:1}
.mainnav a{position:relative;padding:8px 14px;font-size:15px;color:var(--text-2);border-radius:8px}
.mainnav a:hover{color:var(--text);background:var(--hover);text-decoration:none}
.mainnav a.active{color:var(--accent);font-weight:700}
.mainnav a.active::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:var(--accent)}
.topbar-actions{display:flex;align-items:center;gap:10px}
.theme-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:14px}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--hover);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.hamburger{display:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text);align-items:center;justify-content:center}
.theme-menu{position:absolute;top:56px;right:24px;min-width:190px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-hover);padding:6px;display:none}
.theme-menu.open{display:block}
.theme-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:transparent;color:var(--text);font-size:14.5px;border-radius:8px;text-align:left}
.theme-menu button:hover{background:var(--hover)}
.theme-menu button .check{margin-left:auto;color:var(--accent);visibility:hidden}
.theme-menu button.on .check{visibility:visible}
/* ============ 首页 Banner（温暖水彩书桌风） ============ */
.hero{position:relative;background:linear-gradient(140deg,var(--banner1) 0%,var(--banner2) 72%);border-bottom:1px solid var(--border);transition:background .25s;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:6fr 5fr;gap:44px;align-items:center;padding:60px 0 56px}
.hero h1{font-size:44px;letter-spacing:1.5px}
.hero .sub{margin-top:14px;font-size:17px;color:var(--text-2);max-width:34em}
.searchbox{margin-top:26px;display:flex;align-items:center;gap:10px;background:var(--input-bg);border:1px solid var(--border);border-radius:14px;padding:4px 6px 4px 16px;max-width:560px;box-shadow:var(--shadow)}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.searchbox input{flex:1;border:0;background:transparent;outline:none;height:40px;font-size:15px}
.searchbox input::placeholder{color:var(--text-3)}
.hero-cta{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
.hero-side{position:relative;min-height:380px;border-radius:18px;border:1px solid var(--border);box-shadow:var(--shadow-hover);background:var(--hover) url('assets/hero-fox.png') center/cover no-repeat;transition:border-color .25s}
.hero-side .hero-card{position:absolute;right:16px;bottom:16px;width:min(272px,80%);z-index:1}
[data-theme="night"] .hero-side::before{content:"";position:absolute;inset:0;border-radius:18px;background:rgba(33,26,19,.38)}
.hero-card{background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(4px);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-hover);padding:20px 22px;transition:background .25s}
.hero-card h3{font-size:16px;display:flex;align-items:center;gap:8px}
.progressbar{height:8px;border-radius:99px;background:var(--hover);margin:12px 0 6px;overflow:hidden}
.progressbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s ease}
.next-task{margin-top:14px;padding:12px 14px;border:1px dashed var(--border);border-radius:10px;font-size:14px;color:var(--text-2)}
/* ============ 区块通用 ============ */
.section{padding:52px 0 8px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px}
.section-head h2{font-size:24px;display:flex;align-items:center;gap:14px}
.section-head h2::before,.section-head h2::after{content:"";height:1.5px;width:34px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--accent));flex:none}
.section-head h2::after{background:linear-gradient(90deg,var(--accent),transparent)}
.section-head .more{font-size:14px;color:var(--accent);font-weight:600;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);transition:background .25s,box-shadow .2s,transform .15s}
a.card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);text-decoration:none}
.grid{display:grid;gap:20px}
/* 资料分类 */
.cat-grid{grid-template-columns:repeat(5,1fr)}
.cat-card{padding:20px;display:flex;flex-direction:column;gap:10px}
.cat-card .cat-ic{width:38px;height:38px;border-radius:10px;background:var(--hover);color:var(--accent);display:flex;align-items:center;justify-content:center}
.cat-card b{font-size:15.5px;color:var(--text)}
.cat-card span{font-size:13px;color:var(--text-3)}
/* 专项卡片 */
.skill-grid{grid-template-columns:repeat(4,1fr)}
.skill-card{padding:22px;display:flex;flex-direction:column;gap:10px;min-height:196px}
.skill-card .sk-ic{width:40px;height:40px;border-radius:11px;background:var(--hover);color:var(--accent);display:flex;align-items:center;justify-content:center}
.skill-card h3{font-size:16.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.skill-card p{font-size:13.5px;color:var(--text-3);flex:1}
.skill-card .sk-tags{display:flex;gap:6px;flex-wrap:wrap}
.skill-card .btn{margin-top:4px;align-self:flex-start}
/* 课程 / 题库 */
.course-grid{grid-template-columns:repeat(3,1fr)}
.course-card{padding:22px;display:flex;flex-direction:column;gap:12px}
.course-card .c-meta{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-3);flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.badge-doing{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.badge-new{background:var(--hover);color:var(--text-2)}
.course-card .btn{align-self:flex-start;margin-top:auto}
.practice-duo{grid-template-columns:1fr 1fr}
.practice-card{padding:26px;display:flex;flex-direction:column;gap:12px}
.practice-card ul{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--text-2)}
.practice-card li{display:flex;gap:8px;align-items:flex-start}
.practice-card li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;flex:none}
/* 计划摘要 */
.plan-mini{padding:24px}
.task-row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--border);font-size:14.5px}
.task-row:last-child{border-bottom:0}
.task-row .t-main{flex:1;min-width:0}
.task-row .t-title{color:var(--text);font-weight:600}
.task-row .t-meta{font-size:13px;color:var(--text-3);margin-top:2px}
.task-row .t-acts{display:flex;gap:6px;flex:none}
.status{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.st-todo{color:var(--text-2);background:var(--hover)}
.st-done{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.st-late{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.checkbox{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border);background:transparent;flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.checkbox.done{background:var(--ok);border-color:var(--ok);color:#fff}
/* 空状态 */
.empty{padding:44px 20px;text-align:center;color:var(--text-3);border:1px dashed var(--border);border-radius:14px;background:var(--card)}
.empty svg{width:42px;height:42px;margin-bottom:10px;color:var(--text-3)}
.empty b{display:block;font-size:15.5px;color:var(--text-2);margin-bottom:4px}
/* 页脚 */
.footer{margin-top:64px;border-top:1px solid var(--border);padding:30px 0 40px;color:var(--text-3);font-size:13.5px}
.footer .container{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
/* ============ 页面头 / 面包屑 ============ */
.page-head{padding:36px 0 6px}
.crumbs{font-size:13.5px;color:var(--text-3);margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--text-3)}
.crumbs a:hover{color:var(--accent)}
.page-head h1{font-size:30px}
.page-head .desc{color:var(--text-2);margin-top:8px;font-size:15px;max-width:46em}
/* ============ 资料库筛选 ============ */
.filterbar{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;margin-top:22px}
.f-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:7px 0}
.f-label{font-size:13.5px;color:var(--text-3);width:64px;flex:none;font-weight:600}
.chip{padding:5px 14px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:13.5px;transition:all .15s;min-height:32px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.f-search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:0 12px}
.f-search input{flex:1;border:0;background:transparent;outline:0;height:38px;font-size:14px}
.f-toggle{display:none;width:100%;justify-content:space-between;align-items:center;background:transparent;border:1px solid var(--border);border-radius:10px;height:42px;padding:0 14px;color:var(--text);font-size:14.5px}
.active-conds{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13.5px}
.cond{display:inline-flex;align-items:center;gap:6px;background:var(--hover);border-radius:99px;padding:4px 6px 4px 12px;color:var(--text-2)}
.cond button{border:0;background:transparent;color:var(--text-3);display:flex;padding:2px;border-radius:50%}
.cond button:hover{color:var(--danger)}
.clear-all{border:0;background:transparent;color:var(--accent);font-size:13.5px;font-weight:600;padding:4px 8px}
/* 结果列表 */
.result-list{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.paper-item{display:flex;gap:16px;align-items:center;padding:18px 22px}
.paper-item .pi-main{flex:1;min-width:0}
.paper-item h3{font-size:16px;margin-bottom:4px}
.paper-item .pi-meta{font-size:13.5px;color:var(--text-3);display:flex;gap:12px;flex-wrap:wrap}
.type-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:7px;background:var(--hover);color:var(--accent);flex:none;align-self:flex-start}
.type-badge.word{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
/* ============ 试卷页 ============ */
.paper-layout{display:grid;grid-template-columns:250px 1fr;gap:28px;margin-top:24px;align-items:start}
.q-nav{position:sticky;top:86px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.q-nav h4{font-size:14px;color:var(--text-3);margin-bottom:12px;font-weight:600}
.q-nav .sec-name{font-size:13px;font-weight:700;color:var(--text-2);margin:12px 0 8px}
.q-dots{display:flex;flex-wrap:wrap;gap:8px}
.q-dot{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:13px;font-weight:600;transition:all .15s}
.q-dot:hover{border-color:var(--accent);color:var(--accent)}
.q-dot.seen{background:var(--hover)}
.q-block{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;margin-bottom:22px;scroll-margin-top:86px}
.q-block .q-head{display:flex;gap:10px;align-items:baseline;margin-bottom:12px}
.q-num{font-size:13px;font-weight:800;color:var(--accent);flex:none}
.q-block .q-stem{font-size:15.5px;line-height:1.7}
.opts{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14.5px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--hover)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 7%,transparent)}
.analysis{margin-top:16px;border-top:1px dashed var(--border);padding-top:4px}
.analysis summary{list-style:none;display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:14.5px;padding:10px 0;cursor:pointer;user-select:none}
.analysis summary::-webkit-details-marker{display:none}
.analysis summary .chev{transition:transform .2s}
.analysis[open] summary .chev{transform:rotate(180deg)}
.a-layer{padding:10px 0;border-top:1px solid var(--border)}
.a-layer:first-of-type{border-top:0}
.a-layer .a-tag{font-size:12.5px;font-weight:800;color:var(--text-3);letter-spacing:1px;margin-bottom:5px}
.a-answer{font-size:16px;font-weight:700;color:var(--ok)}
.a-body{font-size:14.5px;color:var(--text-2);line-height:1.75}
.point-tags{display:flex;gap:8px;flex-wrap:wrap}
.extend-links{display:flex;gap:10px;flex-wrap:wrap}
.passage-box{margin:14px 0 4px;padding:16px 18px;border-left:3px solid var(--accent);background:var(--hover);border-radius:0 10px 10px 0;font-size:14.5px;line-height:1.75;color:var(--text-2)}
.passage-box b{color:var(--text)}
.audio-line{display:flex;align-items:center;gap:12px;margin:12px 0;padding:12px 16px;border:1px solid var(--border);border-radius:10px}
.audio-line audio{flex:1;height:36px;min-width:0}
/* ============ 阅读页（文章/句子/单词） ============ */
.read-layout{max-width:860px;margin:24px auto 0}
.read-card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:32px 38px}
.read-card .en{font-size:16.5px;line-height:1.75;color:var(--text)}
.read-card .zh{font-size:14.5px;color:var(--text-2);line-height:1.75}
.para{margin-bottom:22px}
.para .zh-toggle{margin-top:8px}
.para .zh{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.para.show-zh .zh{display:block}
.hl-s{background:color-mix(in srgb,var(--warn) 22%,transparent);padding:0 2px;border-radius:3px;cursor:pointer;border-bottom:1.5px dashed var(--warn)}
.hl-w{background:color-mix(in srgb,var(--accent) 15%,transparent);padding:0 2px;border-radius:3px;cursor:pointer;font-weight:600}

.co-item:last-child{border-bottom:0}

/* ============ 学习计划页 ============ */
.plan-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:22px}

.week-bars{display:flex;gap:10px;align-items:flex-end;height:96px;padding:20px 22px 14px}
.wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.wb i{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;background:var(--hover);min-height:4px;transition:height .4s}
.wb.done i{background:linear-gradient(180deg,var(--accent),var(--primary))}
.wb span{font-size:12px;color:var(--text-3)}
.wb b{font-size:12px;color:var(--text-2)}
.plan-form{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;margin:22px 0}
.form-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}

.note-text{font-size:13px;color:var(--text-3);font-style:normal}

.skeleton.on{display:flex}
.sk-line{width:min(680px,86vw);display:flex;flex-direction:column;gap:14px}

/* ---------- 2015—2026 全量试卷目录（事实元数据，内容待录入） ----------
   结构依据公开考试安排：每年6月/12月两考（2020年因疫情增7月、9月考，
   2022年增9月考，2023年增3月考），常规考期每次3套。 */
(function expandCatalog(){
  const MONTHS={2026:['6月'],2025:['12月','6月'],2024:['12月','6月'],2023:['12月','6月','3月'],
    2022:['12月','9月','6月'],2021:['12月','6月'],2020:['12月','9月','7月'],
    2019:['12月','6月'],2018:['12月','6月'],2017:['12月','6月'],2016:['12月','6月'],2015:['12月','6月']};
  const full=Object.fromEntries(PAPERS.map(p=>[p.id,p]));
  const merged=[];
  for(let y=2026;y>=2015;y--){
    for(const m of MONTHS[y]){
      const n=(y===2020&&m==='7月')?1:3;
      const mm=String(Number(m.replace('月',''))).padStart(2,'0');
      for(let s=1;s<=n;s++){
        for(const lv of ['cet4','cet6']){
          const id=y+'-'+mm+'-'+lv+'-'+s;
          merged.push(full[id]||{id:id,year:y,month:m,level:lv==='cet4'?'CET-4':'CET-6',set:s,full:false,sections:[]});
        }
      }
    }
  }
  PAPERS.length=0;PAPERS.push.apply(PAPERS,merged);
})();
/* ---------- 合并外部导入的真实真题数据（若数据文件已加载） ----------
   数据文件由 tools/import_papers.py 从 PDF 生成，挂在 window.PAPER_DATA /
   window.PASSAGE_DATA 上。此处把导入数据并入原型，覆盖"目录卷/建设中卷"，
   但保留原型已含 L1-L4 完整闭环的示例卷（避免破坏长难句/词条双向导航）。 */
(function mergeImported(){
  const P=window.PAPER_DATA;
  if(!P)return;                                    // 未加载数据文件 → 跳过，原型以示例数据运行
  // 1) 文章：合并，并补 paper 字段（导入 passage 用 from 存试卷 id，渲染层依赖 paper）
  const PD=window.PASSAGE_DATA||{};
  Object.keys(PD).forEach(k=>{const pg=PD[k];if(pg&&!pg.paper)pg.paper=pg.from;PASSAGES[k]=pg;});
  // 2) 试卷：数据文件覆盖目录卷；保留原型带 extend 的示例完整卷
  const byId=Object.fromEntries(PAPERS.map(p=>[p.id,p]));
  Object.keys(P).forEach(lv=>{const map=P[lv]||{};Object.keys(map).forEach(id=>{
    const rec=map[id];if(!rec)return;
    const exist=byId[id];
    if(exist&&exist.full&&exist.sections.some(s=>s.items.some(it=>it.extend))){return;} // 示例卷保留
    rec.imported=true;
    rec.full=rec.ans_count!==0;                    // 无答案的特殊考期 → 保持建设中态
    if(rec.ans_short)rec.partial=true;             // 答案不完整 → 标记部分解析
    byId[id]=rec;
  });});
  // 3) 重建 PAPERS：保持目录倒序（2026 → 2015）
  const merged=Object.keys(byId).map(k=>byId[k]);
  merged.sort((a,b)=>b.year-a.year||(a.id<b.id?1:a.id>b.id?-1:0));
  PAPERS.length=0;PAPERS.push.apply(PAPERS,merged);
})();

function validateBackup(d){
  if(!d||typeof d!=='object'||Array.isArray(d))return'文件不是有效的 JSON 对象';
  if(d.app!=='zh-english-prep')return'不是本产品的备份文件';
  if(!Array.isArray(d.tasks))return'备份文件缺少任务数据';
  for(let i=0;i<d.tasks.length;i++){const t=d.tasks[i];
    if(!t||typeof t!=='object'||typeof t.id!=='string'||typeof t.title!=='string'||typeof t.done!=='boolean'||typeof t.date!=='string')return'第 '+(i+1)+' 条任务数据格式不正确'}
  if(d.mastery!==undefined&&(typeof d.mastery!=='object'||d.mastery===null||Array.isArray(d.mastery)))return'掌握度数据格式不正确';
  if(d.theme!==undefined&&!['day','night','eye'].includes(d.theme))return'主题数据格式不正确';
  return null}
function applyBackup(d){const err=validateBackup(d);if(err)return err;
  saveTasks(d.tasks);
  if(d.mastery)store.set(MASTERY_KEY,d.mastery);
  if(d.theme)applyTheme(d.theme);
  return null}

function renderEn(text,marks){let h=esc(text);
  (marks&&marks.words||[]).forEach(wid=>{const w=WORDS[wid];if(!w)return;
    const re=new RegExp('\\b('+w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:s|es|ed|ing|d|tion|ment)?)\\b','i');
    h=h.replace(re,'<a class="hl-w" href="#/word/'+wid+'" title="查看词条">$1</a>')});
  (marks&&marks.sents||[]).forEach(sid=>{const s=SENTENCES[sid];if(!s)return;const k=esc(s.key);
    h=h.replace(k,'<a class="hl-s" href="#/sentence/'+sid+'" title="拆解长难句">'+k+'</a>')});
  return h}

  '<div class="c-meta" style="display:flex;gap:10px;margin-top:10px;font-size:13.5px;color:var(--text-3)"><span class="tag">'+c.level+'</span><span>'+c.lessons+' 课时</span><span>示例课程</span></div>'+
  (doing?'<div class="progressbar"><i style="width:'+c.progress+'%"></i></div>':'')+
  '<h2 style="font-size:18px;margin-top:22px">课程大纲</h2><div class="course-outline">'+
  c.outline.map((o,i)=>'<div class="co-item"><span class="n">'+(i+1)+'</span><span>'+esc(o)+'</span></div>').join('')+'</div>'+
  '<div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap">'+
  '<button class="btn btn-primary" id="startLearn">'+(doing?'继续学习':'开始学习')+'</button>'+
  '<a class="btn btn-outline" href="#/plan?new=1&title='+encodeURIComponent('学习课程：'+c.name)+'">加入学习计划</a></div>'+
  '<p class="note-text" style="margin-top:12px">课程播放为完整版功能，本原型仅演示入口与样式。</p>'+
  '</div></div>';
  document.getElementById('startLearn').addEventListener('click',function(){this.innerHTML='<span class="spinner"></span> 正在进入…';this.disabled=true;
    setTimeout(()=>{this.disabled=false;this.textContent=doing?'继续学习':'开始学习';toast('示例课程：播放功能在完整版提供')},900)})}
/* ==================== 视图：题库 ==================== */
function vPractice(param,query){const mode=query.mode||(query.m?'topic':'topic');
  const topicMods=MODULES.filter(m=>['vocab','grammar','listening','reading','writing','translation','speaking'].includes(m.id));
  const topicTarget={listening:'#/paper/2024-06-cet4-1',reading:'#/paper/2026-06-cet4-1',translation:'#/paper/2026-06-cet4-1',writing:'#/paper/2024-06-cet4-1',vocab:'#/word/development',grammar:'#/sentence/s1'};
  const fullPapers=PAPERS.filter(p=>p.full);
  app.innerHTML='<div class="container">'+
  '<div class="page-head"><div class="crumbs"><a href="#/home">首页</a> / 题库</div><h1>题库</h1><p class="desc">先选考试级别，再按题型专项练习或做整套模考。交卷即判分，逐题解析自动归档到错题本。</p></div>'+
  '<div class="f-row" style="margin-top:18px"><span class="f-label">考试级别</span><button class="chip on">不限</button><button class="chip">CET-4</button><button class="chip">CET-6</button></div>'+
  '<section class="section"><div class="section-head"><h2>题型与分值</h2></div>'+
  '<div class="grid practice-duo">'+Object.keys(SCORE_TABLE).map(lv=>{
    const st=SCORE_TABLE[lv];
    return '<div class="card practice-card"><h3>'+lv+' · 满分 '+st.total+' · 全程 '+st.time+'</h3>'+
    '<ul>'+st.rows.map(r=>'<li><span style="flex:1">'+r[0]+'</span><b style="flex:none">'+r[1]+'</b><span class="muted" style="flex:none;width:64px;text-align:right">'+r[2]+'</span></li>').join('')+'</ul></div>'}).join('')+'</div></section>'+
  '<section class="section"><div class="section-head"><h2>按题型练习</h2></div>'+
  '<div class="grid skill-grid">'+topicMods.map(m=>{const tgt=topicTarget[m.id];
    return '<div class="card skill-card" id="mod-'+m.id+'"><span class="sk-ic">'+ic(m.icon)+'</span><h3>'+m.name+'</h3><p>'+m.desc+'</p><div class="sk-tags">'+m.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>'+
    (tgt?'<a class="btn btn-outline btn-sm" href="'+tgt+'">'+m.act+'</a>':'<button class="btn btn-outline btn-sm" data-demo>练口语</button>')+'</div>'}).join('')+'</div></section>'+
  '<section class="section"><div class="section-head"><h2>整套模考</h2></div>'+
  '<div class="result-list">'+fullPapers.map(p=>'<div class="card paper-item"><span class="type-badge">模考</span>'+
    '<div class="pi-main"><h3>'+paperTitle(p)+'</h3><div class="pi-meta"><span>四题型全真流程</span><span>计时 125 分钟</span><span>交卷即按 710 分制估分</span></div></div>'+
    '<a class="btn btn-primary btn-sm" href="#/paper/'+p.id+'">开始模考</a></div>').join('')+'</div>'+
  '<p class="note-text" style="margin-top:14px">模考作答页与真题卷页共用组件；计时与判分为完整版功能。</p></section></div>';
  app.querySelectorAll('.f-row .chip').forEach(c=>c.addEventListener('click',()=>{app.querySelectorAll('.f-row .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');toast('已选择级别：'+c.textContent)}));
  app.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>toast('口语跟读评分为完整版功能，本页为示例入口')));
  if(query.m){const el=document.getElementById('mod-'+query.m);if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),80)}}
/* ==================== 视图：学习计划 ==================== */
function weekStats(){const tasks=loadTasks();const wk=weekDates();
  const inWeek=tasks.filter(t=>wk.includes(t.date));
  const done=inWeek.filter(t=>t.done).length;
  return{pct:inWeek.length?Math.round(done/inWeek.length*100):0,done,total:inWeek.length,
    perDay:wk.map(d=>({date:d,done:tasks.filter(t=>t.date===d&&t.done).length,total:tasks.filter(t=>t.date===d).length}))}}
function vPlan(param,query){query=query||{};const tasks=loadTasks();const st=weekStats();
  const today=todayStr();
  const groups=[['今日任务',tasks.filter(t=>t.date===today&&!t.done)],
    ['后续任务',tasks.filter(t=>t.date>today&&!t.done)],
    ['已逾期',tasks.filter(t=>taskStatus(t)==='late')],
    ['已完成',tasks.filter(t=>t.done)]];
  const DAYS=['一','二','三','四','五','六','日'];
  app.innerHTML='<div class="container">'+
  '<div class="page-head"><div class="crumbs"><a href="#/home">首页</a> / 学习计划</div><h1>学习计划</h1><p class="desc">把刷题、背词、精读变成每天可勾选的任务。完整记录与备注都在本页管理。</p></div>'+
  '<div class="plan-stats">'+
  statCard('本周完成率',st.pct+'%',st.done+' / '+st.total+' 项')+
  statCard('今日待办',tasks.filter(t=>t.date===today&&!t.done).length+' 项',fmtCN(today))+
  statCard('累计任务',tasks.length+' 项',tasks.filter(t=>t.done).length+' 项已完成')+
  statCard('连续学习','5 天','示例数据 · 完整版自动统计')+
  '</div>'+
  '<div class="card week-bars" style="margin-top:18px">'+st.perDay.map((d,i)=>{
    const h=d.total?Math.max(10,Math.round(d.done/d.total*100)):4;
    return '<div class="wb'+(d.done>0?' done':'')+'"><b>'+(d.total?d.done+'/'+d.total:'')+'</b><i style="height:'+h+'%" title="'+fmtCN(d.date)+'：'+d.done+'/'+d.total+'"></i><span>周'+DAYS[i]+'</span></div>'}).join('')+'</div>'+
  '<div class="plan-form" id="planForm"><h2 style="font-size:18px;margin-bottom:14px">添加任务</h2>'+
    '<div class="form-row"><div class="field" style="flex:2;min-width:240px"><label for="ntTitle">任务内容</label><input id="ntTitle" placeholder="如：精听 2024年6月四级听力 Section B" value="'+esc(query.title||'')+'"></div>'+
    '<div class="field"><label for="ntType">类型</label><select id="ntType"><option>刷题</option><option>背词</option><option>精读</option><option>听力</option><option>自定义</option></select></div>'+
    '<div class="field"><label for="ntDate">计划日期</label><input id="ntDate" type="date" value="'+today+'"></div></div>'+
    '<div class="form-row"><div class="field" style="flex:2;min-width:240px"><label for="ntNote">备注（可选）</label><input id="ntNote" placeholder="如：第二次做仍错 3 题，注意转折词"></div></div>'+
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn btn-primary" id="ntAdd">添加任务</button><span class="note-text">也可以在真题、文章、单词页直接「加入学习计划」。</span></div></div>'+
  (tasks.length===0?'<div class="empty">'+ic('calendar')+'<b>还没有任何任务</b>从上方创建第一个任务，或在学习内容页一键加入。</div>':
    groups.filter(g=>g[1].length).map(g=>'<section class="section"><div class="section-head"><h2 style="font-size:19px">'+g[0]+'（'+g[1].length+'）</h2></div><div class="card plan-mini" style="padding:6px 20px">'+g[1].map(taskMiniRow).join('')+'</div></section>').join(''))+
  (tasks.length?'<div style="margin:22px 0 8px;text-align:right"><button class="btn-text" id="clearTasks" style="color:var(--danger)">清空全部任务</button></div>':'')+
  '<div class="plan-form"><h2 style="font-size:18px;margin-bottom:14px">数据备份与恢复</h2>'+
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
    '<button class="btn btn-outline btn-sm" id="exportBtn">导出备份</button>'+
    '<label class="btn btn-outline btn-sm" style="cursor:pointer">导入备份<input type="file" id="importFile" accept=".json,application/json" hidden></label>'+
    '<span class="note-text">备份包含学习计划任务、单词掌握度与主题设置。</span></div></div>'+
  '</div>';
  function statCard(lbl,num,sub){return '<div class="card stat-card"><div class="lbl">'+lbl+'</div><div class="num">'+num+'</div><div class="muted" style="font-size:12.5px;margin-top:2px">'+sub+'</div></div>'}
  document.getElementById('ntAdd').addEventListener('click',function(){const title=document.getElementById('ntTitle').value.trim();
    if(!title){toast('请填写任务内容');document.getElementById('ntTitle').focus();return}
    const btn=this;btn.innerHTML='<span class="spinner"></span> 添加中…';btn.disabled=true;
    setTimeout(()=>{const ts=loadTasks();ts.unshift({id:'t'+Date.now(),title:title,type:document.getElementById('ntType').value,date:document.getElementById('ntDate').value||today,done:false,note:document.getElementById('ntNote').value.trim(),link:''});saveTasks(ts);toast('任务已添加');vPlan()},600)});
  const ct=document.getElementById('clearTasks');if(ct)ct.addEventListener('click',()=>{saveTasks([]);toast('已清空任务列表');vPlan()});
  document.getElementById('exportBtn').addEventListener('click',exportBackup);
  document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{let d;try{d=JSON.parse(reader.result)}catch(err){toast('导入失败：文件不是有效的 JSON');return}
      const err=applyBackup(d);if(err){toast('导入失败：'+err);return}
      toast('备份已导入');vPlan()};
    reader.readAsText(f);e.target.value=''});
  if(query.new){setTimeout(()=>{const f=document.getElementById('planForm');if(f){f.scrollIntoView({behavior:'smooth',block:'center'});const t=document.getElementById('ntTitle');if(t&&!t.value)t.focus()}},120)}}
/* ==================== 任务勾选（全局委托） ==================== */
function bindTaskToggles(){}
document.addEventListener('click',e=>{
  const tg=e.target.closest('[data-task-toggle]');
  if(tg){e.preventDefault();const ts=loadTasks();const t=ts.find(x=>x.id===tg.dataset.taskToggle);
    if(t){t.done=!t.done;saveTasks(ts);toast(t.done?'已完成：'+t.title:'已重新打开任务');
      const y=window.scrollY;route();requestAnimationFrame(()=>window.scrollTo(0,y))}return}
  const del=e.target.closest('[data-task-del]');
  if(del){const ts=loadTasks().filter(x=>x.id!==del.dataset.taskDel);saveTasks(ts);toast('任务已删除');const y=window.scrollY;route();requestAnimationFrame(()=>window.scrollTo(0,y))}});
/* ==================== 启动 ==================== */
route();
</script>
